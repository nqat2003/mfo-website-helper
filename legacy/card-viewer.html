<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Viewer — Tra cứu thẻ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
    .rarity-S { background: #facc15; color: #000; }
    .rarity-A { background: #c084fc; color: #fff; }
    .rarity-B { background: #f87171; color: #fff; }
    .rarity-C { background: #60a5fa; color: #fff; }
    .rarity-D { background: #4ade80; color: #fff; }
    .rarity-E { background: #9ca3af; color: #fff; }
    .rarity-all { background: #444; color: #fff; }
    .fade-in { animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-6 flex gap-6 min-h-screen">
    <!-- Left Panel -->
    <aside class="w-80 flex-shrink-0 flex flex-col gap-4">
      <!-- Back to Menu -->
      <a href="index.html" class="flex items-center gap-2 px-4 py-2 bg-gray-900 hover:bg-gray-800 rounded-lg text-sm font-medium transition-colors border border-gray-800 w-fit">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" /></svg>
        Back to Menu
      </a>

      <!-- Search Box -->
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
        <h2 class="text-lg font-bold text-white mb-3">Tra cứu thẻ</h2>
        <input
          type="text"
          id="searchInput"
          placeholder="Nhập tên thẻ, số thẻ, hoặc từ khóa..."
          class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all"
        />
      </div>

      <!-- Rarity Filter -->
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
        <label class="text-sm text-gray-400 mb-2 block">Lọc độ hiếm:</label>
        <div class="flex flex-wrap gap-2" id="rarityButtons">
          <button class="rarity-btn active rarity-all px-3 py-1 rounded-md text-xs font-bold border border-gray-700 transition-all" data-rarity="all">全部</button>
          <button class="rarity-btn px-3 py-1 rounded-md text-xs font-bold border border-gray-700 text-gray-400 hover:text-white hover:border-gray-500 transition-all" data-rarity="S">S</button>
          <button class="rarity-btn px-3 py-1 rounded-md text-xs font-bold border border-gray-700 text-gray-400 hover:text-white hover:border-gray-500 transition-all" data-rarity="A">A</button>
          <button class="rarity-btn px-3 py-1 rounded-md text-xs font-bold border border-gray-700 text-gray-400 hover:text-white hover:border-gray-500 transition-all" data-rarity="B">B</button>
          <button class="rarity-btn px-3 py-1 rounded-md text-xs font-bold border border-gray-700 text-gray-400 hover:text-white hover:border-gray-500 transition-all" data-rarity="C">C</button>
          <button class="rarity-btn px-3 py-1 rounded-md text-xs font-bold border border-gray-700 text-gray-400 hover:text-white hover:border-gray-500 transition-all" data-rarity="D">D</button>
          <button class="rarity-btn px-3 py-1 rounded-md text-xs font-bold border border-gray-700 text-gray-400 hover:text-white hover:border-gray-500 transition-all" data-rarity="E">E</button>
        </div>
      </div>

      <!-- Results List -->
      <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 flex-1 flex flex-col min-h-0">
        <div class="text-sm text-gray-400 mb-2">Tìm thấy <span id="resultCount" class="text-yellow-400 font-bold">0</span> thẻ</div>
        <div id="cardList" class="flex-1 overflow-y-auto bg-gray-950 rounded-lg p-2 space-y-1"></div>
      </div>
    </aside>

    <!-- Right Panel -->
    <main id="cardDetail" class="flex-1 bg-gray-900 border border-gray-800 rounded-xl p-6 fade-in">
      <div class="text-center text-gray-500 py-20">
        <div class="text-4xl mb-4">🃏</div>
        <p class="text-lg">Chọn một thẻ từ danh sách bên trái để xem chi tiết</p>
      </div>
    </main>
  </div>

  <script>
    let allCards = [];
    let fuse = null;
    let currentRarity = 'all';
    let selectedCardId = null;

    const RARITY_ORDER = ['S','A','B','C','D','E'];

    async function init() {
      try {
        const res = await fetch('data/cards.json');
        if (!res.ok) throw new Error('Failed to load cards.json');
        const data = await res.json();
        let baseCards = data.cards || [];

        // Merge with localStorage custom cards
        let customCards = [];
        try {
          const raw = localStorage.getItem('card_editor_custom');
          if (raw) customCards = JSON.parse(raw);
        } catch (e) { /* ignore parse errors */ }

        // Merge: localStorage overrides base on duplicate IDs
        const baseMap = new Map(baseCards.map(c => [c.id, c]));
        customCards.forEach(c => baseMap.set(c.id, c));
        allCards = Array.from(baseMap.values());
        allCards.sort((a, b) => a.id - b.id);

        fuse = new Fuse(allCards, {
          keys: ['id', 'card_number', 'name_cn', 'name_vn', 'description', 'description_vn',
                 'pet_usable', 'pet_usable_vn', 'attack_attribute', 'attack_attribute_vn',
                 'attack_domain', 'attack_domain_vn', 'skill_effect', 'skill_effect_vn'],
          threshold: 0.4,
          includeScore: false
        });

        bindEvents();
        renderCardList(allCards);
      } catch (err) {
        document.getElementById('cardList').innerHTML =
          '<div class="text-red-400 text-sm text-center py-4">Không thể tải dữ liệu thẻ. Vui lòng thử lại sau.</div>';
        console.error(err);
      }
    }

    function bindEvents() {
      // Search input with debounce
      let debounceTimer;
      document.getElementById('searchInput').addEventListener('input', e => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => doSearch(e.target.value.trim()), 150);
      });

      // Rarity buttons
      document.querySelectorAll('.rarity-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.rarity-btn').forEach(b => {
            b.classList.remove('active');
            b.className = 'rarity-btn px-3 py-1 rounded-md text-xs font-bold border border-gray-700 text-gray-400 hover:text-white hover:border-gray-500 transition-all';
          });
          btn.classList.add('active');
          btn.className = 'rarity-btn active rarity-' + btn.dataset.rarity + ' px-3 py-1 rounded-md text-xs font-bold border border-gray-700 transition-all';
          currentRarity = btn.dataset.rarity;
          doSearch(document.getElementById('searchInput').value.trim());
        });
      });
    }

    function doSearch(query) {
      let results = [];
      if (!query) {
        results = allCards;
      } else {
        results = fuse.search(query).map(r => r.item);
      }
      if (currentRarity !== 'all') {
        results = results.filter(c => c.rarity === currentRarity);
      }
      renderCardList(results);
    }

    function renderCardList(cards) {
      document.getElementById('resultCount').textContent = cards.length;
      const list = document.getElementById('cardList');

      if (cards.length === 0) {
        list.innerHTML = '<div class="text-gray-500 text-sm text-center py-8">Không tìm thấy thẻ nào phù hợp</div>';
        return;
      }

      list.innerHTML = cards.map(card => `
        <div class="card-item cursor-pointer p-3 rounded-lg transition-all ${selectedCardId === card.id ? 'bg-yellow-900/40 border-l-4 border-yellow-400' : 'bg-gray-800 hover:bg-gray-700 border-l-4 border-transparent'}"
             onclick="selectCard(${card.id})">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-xs text-gray-500 font-mono">#${card.id}</span>
              <span class="text-sm font-semibold text-white">${escapeHtml(card.name_cn)}</span>
            </div>
            <span class="px-2 py-0.5 rounded text-xs font-bold rarity-${card.rarity}">${card.rarity}</span>
          </div>
        </div>
      `).join('');
    }

    function selectCard(id) {
      selectedCardId = id;
      const card = allCards.find(c => c.id === id);
      if (!card) return;

      // Re-render list to update selection highlight
      const query = document.getElementById('searchInput').value.trim();
      let results = [];
      if (!query) results = allCards;
      else results = fuse.search(query).map(r => r.item);
      if (currentRarity !== 'all') results = results.filter(c => c.rarity === currentRarity);
      renderCardList(results);

      renderCardDetail(card);
    }

    function renderCardDetail(card) {
      const hasImage = card.image && card.image.trim() !== '';
      const imgHtml = hasImage
        ? `<img src="${escapeHtml(card.image)}" alt="${escapeHtml(card.name_vn)}" class="w-full max-w-sm mx-auto rounded-xl border-2 border-gray-700" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`
        : '';

      const placeholderHtml = `
        <div class="placeholder-card w-full max-w-sm mx-auto rounded-xl border-2 border-gray-700 bg-gradient-to-b from-gray-800 to-gray-900 flex flex-col items-center justify-center py-12 ${hasImage ? 'hidden' : ''}">
          <div class="text-5xl mb-2">🃏</div>
          <div class="text-lg font-bold text-gray-300">${escapeHtml(card.name_cn)}</div>
          <div class="text-sm text-gray-500">${escapeHtml(card.name_vn)}</div>
        </div>
      `;

      const effectsHtml = [];
      if (card.phantom_side_effect !== 0) {
        effectsHtml.push(`<div class="flex justify-between py-2 px-3 bg-gray-950/30 rounded-lg border border-gray-800/50"><span class="text-sm text-gray-400">Ảo ảnh phụ</span><span class="text-sm font-semibold ${card.phantom_side_effect > 0 ? 'text-emerald-400' : 'text-red-400'}">${card.phantom_side_effect > 0 ? '+' : ''}${card.phantom_side_effect}</span></div>`);
      }
      if (card.map_effect !== 0) {
        effectsHtml.push(`<div class="flex justify-between py-2 px-3 bg-gray-950/30 rounded-lg border border-gray-800/50"><span class="text-sm text-gray-400">Hiệu ứng bản đồ</span><span class="text-sm font-semibold ${card.map_effect > 0 ? 'text-emerald-400' : 'text-red-400'}">${card.map_effect > 0 ? '+' : ''}${card.map_effect}</span></div>`);
      }

      const detailHtml = `
        <div class="fade-in">
          <!-- Image -->
          <div class="mb-6">
            ${imgHtml}
            ${placeholderHtml}
          </div>

          <!-- Names & Rarity -->
          <div class="text-center mb-6">
            ${card.card_number ? `<div class="text-sm text-gray-500 mb-1">Số thẻ: <span class="text-yellow-400 font-mono font-bold">${escapeHtml(card.card_number)}</span></div>` : ''}
            <h1 class="text-2xl font-bold text-white">${escapeHtml(card.name_vn)}</h1>
            <p class="text-sm text-gray-400 mt-1">${escapeHtml(card.name_cn)}</p>
            <span class="inline-block mt-3 px-4 py-1 rounded-full text-sm font-bold rarity-${card.rarity}">${card.rarity}</span>
            ${(card.pet_usable_vn || card.pet_usable) ? `<div class="mt-3 text-sm"><span class="text-gray-500">Thú cưng:</span> <span class="text-amber-400 font-medium">${escapeHtml(card.pet_usable_vn || card.pet_usable)}</span></div>` : ''}
          </div>

          <!-- Stats Grid -->
          <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-gray-950 border border-gray-800 rounded-lg p-3"><div class="text-xs text-gray-500 mb-1">Cost</div><div class="text-lg font-bold text-white">${card.cost.toFixed(2)}</div></div>
            <div class="bg-gray-950 border border-gray-800 rounded-lg p-3"><div class="text-xs text-gray-500 mb-1">SP Tiêu hao</div><div class="text-lg font-bold text-white">${card.sp_cost}</div></div>
            <div class="bg-gray-950 border border-gray-800 rounded-lg p-3"><div class="text-xs text-gray-500 mb-1">Điểm PP</div><div class="text-lg font-bold text-white">${card.attack_point_cost}</div></div>
            <div class="bg-gray-950 border border-gray-800 rounded-lg p-3"><div class="text-xs text-gray-500 mb-1">Cấp tối thiểu</div><div class="text-lg font-bold text-white">${card.min_level}</div></div>
            <div class="bg-gray-950 border border-gray-800 rounded-lg p-3"><div class="text-xs text-gray-500 mb-1">Hồi chiêu</div><div class="text-lg font-bold text-white">${card.cooldown}</div></div>
            <div class="bg-gray-950 border border-gray-800 rounded-lg p-3"><div class="text-xs text-gray-500 mb-1">Khởi động</div><div class="text-lg font-bold text-white">${card.warmup}</div></div>
          </div>

          <!-- Categorical Stats -->
          <div class="bg-gray-950 border border-gray-800 rounded-lg p-4 mb-6 space-y-2">
            <div class="flex justify-between"><span class="text-sm text-gray-400">Thuộc tính tấn công</span><span class="text-sm font-semibold text-white">${escapeHtml(card.attack_attribute_vn)} <span class="text-gray-500">(${escapeHtml(card.attack_attribute)})</span></span></div>
            <div class="flex justify-between"><span class="text-sm text-gray-400">Lĩnh vực tấn công</span><span class="text-sm font-semibold text-white">${escapeHtml(card.attack_domain_vn)} <span class="text-gray-500">(${escapeHtml(card.attack_domain)})</span></span></div>
            <div class="flex justify-between"><span class="text-sm text-gray-400">Phạm vi tấn công</span><span class="text-sm font-semibold text-white">${escapeHtml(card.attack_range_vn)}</span></div>
            <div class="flex justify-between"><span class="text-sm text-gray-400">Phương thức thi triển</span><span class="text-sm font-semibold text-white">${escapeHtml(card.cast_method_vn)}</span></div>
          </div>

          <!-- Effects -->
          ${effectsHtml.length > 0 ? `<div class="space-y-2 mb-6">${effectsHtml.join('')}</div>` : ''}
          ${renderSideEffectsTags(card.side_effects)}

          <!-- Skill Effect -->
          <div class="bg-gray-950 border border-gray-800 rounded-lg p-4">
            <div class="text-xs text-gray-500 mb-2 uppercase tracking-wider">Hiệu ứng kỹ năng</div>
            <p class="text-sm text-gray-300 leading-relaxed">${escapeHtml(card.skill_effect_vn || card.skill_effect)}</p>
          </div>
        </div>
      `;

      document.getElementById('cardDetail').innerHTML = detailHtml;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderSideEffectsTags(sideEffects) {
      if (!sideEffects) return '';
      let entries = [];
      if (typeof sideEffects === 'object' && !Array.isArray(sideEffects)) {
        entries = Object.entries(sideEffects);
      } else if (typeof sideEffects === 'string' && sideEffects.trim()) {
        sideEffects.split(',').forEach(pair => {
          const [key, val] = pair.split(':');
          if (key && val !== undefined) entries.push([key.trim(), parseFloat(val.trim())]);
        });
      }
      if (entries.length === 0) return '';
      const tags = entries.map(([name, val]) => {
        const numVal = parseFloat(val);
        const colorClass = numVal < 0 ? 'text-red-400 border-red-400/50' : 'text-emerald-400 border-emerald-400/50';
        const prefix = numVal > 0 ? '+' : '';
        return `<span class="inline-block px-2 py-1 rounded-md text-xs font-medium bg-gray-800 border ${colorClass}">${escapeHtml(name)}: ${prefix}${val}</span>`;
      }).join('');
      return `<div class="mb-4"><div class="text-xs text-gray-500 mb-2 uppercase tracking-wider">Tác dụng phụ thuộc tính</div><div class="flex flex-wrap gap-2">${tags}</div></div>`;
    }

    init();
  </script>
</body>
</html>
